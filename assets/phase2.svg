      .subtitle { font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; font-size: 18px; font-weight: 500; opacity: 0.92; }
    </style>
  </defs>

  <rect x="0" y="0" width="512" height="512" fill="url(#g)"/>

  <circle cx="256" cy="256" r="218" fill="none" stroke="#2de2e6" stroke-width="4" filter="url(#glowB)"/>
